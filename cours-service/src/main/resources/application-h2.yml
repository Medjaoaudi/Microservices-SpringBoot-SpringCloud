# Profil H2 (par défaut) : base fichier indépendante ./data/cours_db
spring:
  datasource:
    url: jdbc:h2:file:./data/cours_db;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
