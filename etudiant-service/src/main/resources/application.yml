server:
  port: 8081
  # Respecte les en-têtes X-Forwarded-* posés par la Gateway (URL "servers" correcte dans Swagger agrégé)
  forward-headers-strategy: framework

spring:
  application:
    name: etudiant-service
  profiles:
    # H2 par défaut (aucune installation requise). MySQL : --spring.profiles.active=mysql
    default: h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
